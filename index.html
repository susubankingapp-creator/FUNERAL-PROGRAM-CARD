<body>
  <div id="__bundler_placeholder">Loading Funeral Program...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }
  window.addEventListener('error', function(e) {
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    const printStyles = `
      @page { size: 148mm 210mm; margin: 0; }
      html { background: #f5f4ef; }
      body { box-sizing: border-box; width: 100%; margin: 0; padding: 24px 16px 48px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
      .board { position: relative; width: min(559px, 100%); height: calc(794px * var(--card-scale, 1) + 32px); }
      .board h2 { margin: 0 0 12px; }
      .board .add-text { position: absolute; top: -4px; right: 0; padding: 5px 10px; border: 1px solid #d6c89f; border-radius: 7px; background: #fff; color: #0a1b47; font: 600 12px/1.2 system-ui, sans-serif; cursor: pointer; }
      .board iframe { width: 559px !important; height: 794px !important; transform: scale(var(--card-scale, 1)); transform-origin: top left; }
      #print-output { display: none; }
      #program-controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; box-sizing: border-box; width: 100%; max-width: 1150px; padding: 14px; border: 1px solid #e3d6b7; border-radius: 14px; background: rgba(255,255,255,.96); box-shadow: 0 5px 18px rgba(10,27,71,.12); font: 13px/1.2 system-ui, sans-serif; }
      #program-controls button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 9px 13px; border: 1px solid #d6c89f; border-radius: 9px; background: #fff; color: #0a1b47; font: 600 13px/1.2 system-ui, sans-serif; cursor: pointer; transition: background .15s ease, box-shadow .15s ease, transform .15s ease; }
      #program-controls button:hover { background: #f8f4e9; box-shadow: 0 2px 6px rgba(10,27,71,.12); transform: translateY(-1px); }
      #program-controls .primary-action { border-color: #b88f36; background: linear-gradient(135deg, #14295b, #0a1b47); color: #f6e5ad; box-shadow: 0 3px 8px rgba(10,27,71,.22); }
      #program-controls .primary-action:hover { background: linear-gradient(135deg, #203b77, #10275c); }
      #program-controls #reset-edits { border-color: transparent; background: transparent; color: #67645d; }
      #edit-status { max-width: 210px; color: #66625a; font-size: 12px; text-align: center; }
      #program-controls label { display: inline-flex; align-items: center; gap: 5px; color: #514a3d; font-weight: 600; }
      #program-controls [hidden] { display: none !important; }
      #program-controls select, #program-controls input { min-height: 38px; padding: 6px; border: 1px solid #d6c89f; border-radius: 8px; background: white; color: #0a1b47; font: inherit; }
      #program-controls input[type=file] { max-width: 180px; }
      @media screen and (max-width: 640px) {
        #program-controls { padding: 10px; }
        #edit-status { flex-basis: 100%; max-width: none; order: 1; }
      }
      @media print {
        html, body { width: 148mm; margin: 0 !important; padding: 0 !important; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        body { display: block; }
        #program-controls, .board { display: none !important; }
        #print-output { display: block; }
        .print-page { width: 148mm; height: 210mm; overflow: hidden; break-after: page; page-break-after: always; }
        .print-page:last-child { break-after: auto; page-break-after: auto; }
      }
    `;
    template = template.replace('</style>', printStyles + '</style>');
    template = template.replace(
      '<body>',
      '<body><nav id="program-controls" aria-label="Program editing controls"><button id="toggle-edit" type="button">Edit text</button><label id="row-icon-label" hidden>Row icon <select id="row-icon"><option value="0">Clock</option><option value="1">Music</option><option value="2">Chairman</option><option value="3">Microphone</option><option value="4">Closing song</option><option value="upload">Upload image</option></select></label><label id="icon-upload-label" hidden>Image <input id="icon-upload" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="add-row" type="button" hidden>Add program row</button><button id="reset-edits" type="button">Reset edits</button><label>Pages <select id="print-pages"><option value="both">Both pages</option><option value="cover">Cover only</option><option value="order">Order only</option></select></label><button id="print-pdf" class="primary-action" type="button">Print</button><button id="download-pdf" class="primary-action" type="button">Download PDF</button><button id="download-svg" type="button">Download SVG</button><span id="edit-status" role="status">Edits save automatically in this browser.</span></nav><div id="print-output" aria-hidden="true"></div>'
    );
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true;
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {};
    const pendingRelays = {};
    function mountPage(el, frag, text) {
      el.srcdoc = text;
      waitForProgramPage(el, 0);
    }
    function waitForProgramPage(frame, attempts) {
      const frameDoc = frame.contentDocument;
      if (frameDoc && frameDoc.body && frameDoc.querySelector('#dc-root [data-dc-tpl="4"]') && frameDoc.querySelector('#dc-root').innerText.trim()) {
        setupEditableText(frame);
        return;
      }
      if (attempts >= 100) {
        console.error('Timed out waiting for the funeral program page:', frame.title);
        editStatus.textContent = 'Could not load text editor.';
        return;
      }
      window.setTimeout(function() { waitForProgramPage(frame, attempts + 1); }, 100);
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) {  }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) {  }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) {  }
          return;
        }
        if (isPageRoot || window.parent === window) return;
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +

    const headOpen = template.match(/<head[^>]*>/i);

    const editButton = document.getElementById('toggle-edit');

    function updateFrameEditMode(frame) {

    function setupEditableText(frame) {
      const frameDoc = frame.contentDocument;
      if (!frameDoc || !frameDoc.body) {
        console.error('Unable to access the funeral program page for editing:', frame.title);
        editStatus.textContent = 'Could not load text editor.';
        return;
      }

      const storageKey = storagePrefix + frame.title;
      let savedEdits = {};
      try {
        let saved = localStorage.getItem(storageKey);
        if (saved === null) {
          saved = localStorage.getItem(oldStoragePrefix + frame.title);
          if (saved !== null) localStorage.setItem(storageKey, saved);
        }
        if (saved) {
          const parsed = JSON.parse(saved);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            throw new Error('Saved edits are not a text map.');
          }
          savedEdits = parsed;
        }
      } catch (err) {
        console.error('Unable to load saved funeral program edits:', err);
        editStatus.textContent = 'Saved edits could not be loaded.';
      }
      frame.__programTextEdits = savedEdits;

      const walker = frameDoc.createTreeWalker(frameDoc.body, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let textNode;
      while ((textNode = walker.nextNode())) {
        if (
          textNode.nodeValue.trim() &&
          textNode.parentElement &&
          textNode.parentElement.namespaceURI === 'http://www.w3.org/1999/xhtml' &&
          !textNode.parentElement.closest('script, style, noscript')

          textNodes.push(textNode);

      textNodes.forEach(function(node, index) {
        const editable = frameDoc.createElement('span');

        node.replaceWith(editable);

      const editorStyle = frameDoc.createElement('style');

        .program-text-editable { outline: 1px dashed #c9a24b; outline-offset: 2px; cursor: text; caret-color: #c9a24b; }

        .added-content { min-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .added-text { padding: 6px 8px; background: #fff; border: 1px solid #c9a24b; }
        .added-item table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; }
        .added-item td { border: 1px solid #967c41; padding: 4px; vertical-align: top; }
        .custom-row.editing { outline: 1px dashed #c9a24b; }
        .custom-row [data-row-field] { min-width: 20px; }
        .custom-row-remove { display: none; position: absolute; right: 4px; top: -13px; z-index: 2; border: 0; border-radius: 4px; background: #0a1b47; color: white; font: 11px Arial, sans-serif; cursor: pointer; }
        .custom-row.editing .custom-row-remove { display: block; }
        .custom-row-icon img { width: 75%; height: 75%; border-radius: 50%; object-fit: cover; }
        @media print {

          .program-text-editable, .program-text-editable:focus, .added-item.editing, .custom-row.editing { outline: none; }
          .added-controls, .added-item.editing .added-controls, .custom-row-remove { display: none; }
        }`;
      frameDoc.head.appendChild(editorStyle);

      frameDoc.addEventListener('input', function(event) {
        const target = event.target.closest('[data-editable-text-index]');
        if (!target) return;
        savedEdits[target.dataset.editableTextIndex] = target.textContent;
        try {
          localStorage.setItem(storageKey, JSON.stringify(savedEdits));
          editStatus.textContent = 'Changes saved in this browser.';
        } catch (err) {
          console.error('Unable to save funeral program edits:', err);
          editStatus.textContent = 'Changes could not be saved.';
        }
      });

      updateFrameEditMode(frame);
      setupAdditions(frame);
      if (frame.title === 'Order of Program') setupProgramRows(frame);

    function setupAdditions(frame) {
      const frameDoc = frame.contentDocument;
      const page = frameDoc.querySelector('#dc-root [data-dc-tpl="4"]');
      if (!page) {
        console.error('Unable to find the program page for added items:', frame.title);
        editStatus.textContent = 'Could not load added items.';
        return;
      }
      const storageKey = additionsPrefix + frame.title;
      let items = [];
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved) {
          items = JSON.parse(saved);
          if (!Array.isArray(items) || items.some(function(item) {
            return !item || !['text', 'table'].includes(item.type) ||
              !Number.isFinite(item.x) || !Number.isFinite(item.y) ||
              !Array.isArray(item.cells) || !item.cells.length || item.cells.length > 8 ||
              item.cells.some(function(row) { return !Array.isArray(row) || !row.length || row.length > 8 || row.some(function(cell) { return typeof cell !== 'string'; }); });
          })) throw new Error('Saved items have an invalid format.');
        }
      } catch (err) {
        console.error('Unable to load added items:', err);
        editStatus.textContent = 'Added items could not be loaded.';
        return;
      }

      function saveItems() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(items));
          editStatus.textContent = 'Changes saved in this browser.';
        } catch (err) {
          console.error('Unable to save added items:', err);
          editStatus.textContent = 'Changes could not be saved.';
        }
      }

      function renderItem(item) {
        const box = frameDoc.createElement('div');
        box.className = 'added-item';
        box.style.left = item.x + 'px';
        box.style.top = item.y + 'px';
        const controls = frameDoc.createElement('div');
        controls.className = 'added-controls';
        const move = frameDoc.createElement('button');
        move.type = 'button';
        move.className = 'move-item';
        move.textContent = 'Move';
        move.title = 'Drag or use arrow keys to move';
        const remove = frameDoc.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Remove';
        controls.append(move, remove);
        box.appendChild(controls);

        function makeContent(row, column) {
          const content = frameDoc.createElement('div');
          content.className = 'added-content';
          content.contentEditable = editMode ? 'plaintext-only' : 'false';
          content.textContent = item.cells[row][column];
          content.addEventListener('input', function() {
            item.cells[row][column] = content.innerText;
            saveItems();
          });
          return content;
        }

        if (item.type === 'text') {
          const content = makeContent(0, 0);
          content.classList.add('added-text');
          box.appendChild(content);
        } else {
          const table = frameDoc.createElement('table');
          const body = frameDoc.createElement('tbody');
          item.cells.forEach(function(row, rowIndex) {
            const tr = frameDoc.createElement('tr');
            row.forEach(function(cell, columnIndex) {
              const td = frameDoc.createElement('td');
              td.appendChild(makeContent(rowIndex, columnIndex));
              tr.appendChild(td);
            });
            body.appendChild(tr);
          });
          table.appendChild(body);
          box.appendChild(table);
        }
        box.classList.toggle('editing', editMode);
        page.appendChild(box);

        function position(x, y) {
          item.x = Math.max(0, Math.min(x, Math.max(0, page.clientWidth - box.offsetWidth)));
          item.y = Math.max(0, Math.min(y, Math.max(0, page.clientHeight - box.offsetHeight)));
          box.style.left = item.x + 'px';
          box.style.top = item.y + 'px';
        }
        move.addEventListener('pointerdown', function(event) {
          event.preventDefault();
          const startX = event.clientX, startY = event.clientY, left = item.x, top = item.y;
          move.setPointerCapture(event.pointerId);
          function drag(e) { position(left + e.clientX - startX, top + e.clientY - startY); }
          function finish() {
            move.removeEventListener('pointermove', drag);
            move.removeEventListener('pointerup', finish);
            move.removeEventListener('pointercancel', finish);
            saveItems();
          }
          move.addEventListener('pointermove', drag);
          move.addEventListener('pointerup', finish);
          move.addEventListener('pointercancel', finish);
        });
        move.addEventListener('keydown', function(event) {
          const offsets = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
          if (!offsets[event.key]) return;
          event.preventDefault();
          const step = event.shiftKey ? 10 : 1;
          position(item.x + offsets[event.key][0] * step, item.y + offsets[event.key][1] * step);
          saveItems();
        });
        remove.addEventListener('click', function() {
          items.splice(items.indexOf(item), 1);
          box.remove();
          saveItems();
        });
      }

      items.forEach(renderItem);
      frame.__addProgramItem = function(type, rows, columns) {
        const item = { type: type, x: 170, y: 300, cells: Array.from({ length: rows }, function() { return Array.from({ length: columns }, function() { return type === 'text' ? 'Your text here' : ''; }); }) };
        items.push(item);
        renderItem(item);
        saveItems();
      };
      frame.__resetProgramItems = function() {
        localStorage.removeItem(storageKey);
        items = [];
        page.querySelectorAll('.added-item').forEach(function(item) { item.remove(); });
      };
    }

    function setupProgramRows(frame) {
      const doc = frame.contentDocument;
      const list = doc.querySelector('#dc-root [data-dc-tpl="93"]');
      if (!list || list.children.length < 6) {
        console.error('Unable to find the program rows.');
        editStatus.textContent = 'Could not load the program row editor.';
        return;
      }
      const originals = Array.from(list.children).slice(1, 6);
      const icons = originals.map(function(row) { return row.firstElementChild.firstElementChild.cloneNode(true); });
      let rows = [];
      try {
        const saved = localStorage.getItem(rowsKey);
        if (saved) {
          rows = JSON.parse(saved);
          if (!Array.isArray(rows) || rows.length > 3 || rows.some(function(row) {
            return !row || typeof row.label !== 'string' || typeof row.value !== 'string' ||
              !(Number.isInteger(row.icon) && row.icon >= 0 && row.icon < icons.length) &&
              !(typeof row.icon === 'string' && /^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(row.icon) && row.icon.length <= 350000);
          })) throw new Error('Saved program rows have an invalid format.');
        }
      } catch (err) {
        console.error('Unable to load program rows:', err);
        editStatus.textContent = 'Program rows could not be loaded.';
        return;
      }

      function saveRows() {
        try {
          localStorage.setItem(rowsKey, JSON.stringify(rows));
          editStatus.textContent = 'Changes saved in this browser.';
        } catch (err) {
          console.error('Unable to save program rows:', err);
          editStatus.textContent = 'Program rows could not be saved.';
        }
      }
      function layoutRows() {
        const all = originals.concat(Array.from(list.querySelectorAll(':scope > .custom-row')));
        const height = (292 - 8 * (all.length - 1)) / all.length;
        all.forEach(function(row) {
          row.style.height = height + 'px';
          const icon = row.firstElementChild;
          const iconSize = Math.min(38, height - 6);
          icon.style.width = iconSize + 'px';
          icon.style.height = iconSize + 'px';
          const text = row.children[1];
          text.children[0].style.fontSize = all.length > 5 ? '8px' : '9px';
          text.children[1].style.fontSize = all.length > 6 ? '17px' : all.length > 5 ? '19px' : '22px';
          row.children[2].style.fontSize = all.length > 6 ? '19px' : '24px';
        });
        Array.from(list.querySelectorAll(':scope > .custom-row')).forEach(function(row, i) {
          row.children[2].textContent = ['vi', 'vii', 'viii'][i];
        });
      }
      function renderRow(item) {
        const row = originals[0].cloneNode(true);
        row.className = 'custom-row';
        row.querySelectorAll('[data-editable-text-index]').forEach(function(el) {
          el.removeAttribute('data-editable-text-index');
          el.removeAttribute('data-original-text');
          el.classList.remove('program-text-editable');
        });
        const iconBox = row.children[0];
        iconBox.classList.add('custom-row-icon');
        iconBox.replaceChildren();
        if (typeof item.icon === 'number') {
          iconBox.appendChild(icons[item.icon].cloneNode(true));
        } else {
          const image = doc.createElement('img');
          image.src = item.icon;
          image.alt = '';
          iconBox.appendChild(image);
        }
        const text = row.children[1];
        ['label', 'value'].forEach(function(name, i) {
          const field = text.children[i].firstElementChild;
          field.dataset.rowField = name;
          field.textContent = item[name];
          field.contentEditable = editMode ? 'plaintext-only' : 'false';
          field.addEventListener('input', function() { item[name] = field.innerText; saveRows(); });
        });
        const remove = doc.createElement('button');
        remove.type = 'button';
        remove.className = 'custom-row-remove';
        remove.textContent = 'Remove row';
        remove.addEventListener('click', function() {
          rows.splice(rows.indexOf(item), 1);
          row.remove();
          layoutRows();
          saveRows();
        });
        row.appendChild(remove);
        row.classList.toggle('editing', editMode);
        list.appendChild(row);
      }
      rows.forEach(renderRow);
      layoutRows();
      frame.__addProgramRow = function(icon) {
        if (rows.length >= 3) {
          editStatus.textContent = 'A maximum of three extra rows fits on this card.';
          return;
        }
        const row = { label: 'PROGRAM ITEM', value: 'Add details', icon: icon };
        rows.push(row);
        renderRow(row);
        layoutRows();
        saveRows();
        editStatus.textContent = 'Click the new row text to edit it.';
        frame.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      frame.__resetProgramRows = function() {
        localStorage.removeItem(rowsKey);
        rows = [];
        list.querySelectorAll(':scope > .custom-row').forEach(function(row) { row.remove(); });
        layoutRows();
      };
    }

    function enableEditing() {
      if (!editMode) editButton.click();
    }
    function addItem(frame) {
      if (!frame || !frame.__addProgramItem) {
        editStatus.textContent = 'The selected page is not ready for editing.';
        return;
      }
      enableEditing();
      frame.__addProgramItem('text', 1, 1);

      frame.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    document.querySelectorAll('.board').forEach(function(board) {
      const frame = board.querySelector('iframe');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'add-text';
      button.textContent = 'Add text';
      button.setAttribute('aria-label', 'Add text to ' + frame.title);

    const iconSelect = document.getElementById('row-icon');
    const iconUpload = document.getElementById('icon-upload');
    iconSelect.addEventListener('change', function() {
      document.getElementById('icon-upload-label').hidden = !editMode || iconSelect.value !== 'upload';
    });
    document.getElementById('add-row').addEventListener('click', async function() {
      const frame = document.querySelectorAll('.board iframe')[1];
      if (!frame || !frame.__addProgramRow) {
        editStatus.textContent = 'The order page is not ready for editing.';
        return;
      }
      let icon = Number(iconSelect.value);
      if (iconSelect.value === 'upload') {
        const file = iconUpload.files[0];

          editStatus.textContent = 'Choose a PNG, JPEG or WebP image smaller than 250 KB.';

        try {
          icon = await new Promise(function(resolve, reject) {

        }
      }
      frame.__addProgramRow(icon);
    });
    function selectedFrames() {
      const frames = Array.from(document.querySelectorAll('.board iframe'));
      const selection = document.getElementById('print-pages').value;
      const selected = selection === 'cover' ? [frames[0]] : selection === 'order' ? [frames[1]] : frames;
      if (selected.some(function(frame) { return !frame || !frame.__addProgramItem || (frame.title === 'Order of Program' && !frame.__addProgramRow); })) {
        throw new Error('Please wait until the selected pages have loaded.');
      }
      return selected;
    }

    function cleanPage(frame, index) {
      const page = frame.contentDocument.querySelector('#dc-root [data-dc-tpl="4"]').cloneNode(true);
      page.querySelectorAll('.added-controls, .custom-row-remove').forEach(function(el) { el.remove(); });
      page.querySelectorAll('[contenteditable]').forEach(function(el) { el.removeAttribute('contenteditable'); });
      page.querySelectorAll('.program-text-editable, .editing').forEach(function(el) {
        el.classList.remove('program-text-editable', 'editing');
      });
      const ids = new Map();
      page.querySelectorAll('[id]').forEach(function(el) {
        const old = el.id;
        const replacement = 'page-' + index + '-' + old;
        ids.set(old, replacement);
        el.id = replacement;
      });
      page.querySelectorAll('*').forEach(function(el) {
        Array.from(el.attributes).forEach(function(attribute) {
          let value = attribute.value;
          if (value.startsWith('#') && ids.has(value.slice(1))) value = '#' + ids.get(value.slice(1));
          value = value.replace(/url\(#([^)]*)\)/g, function(match, id) {
            return ids.has(id) ? 'url(#' + ids.get(id) + ')' : match;
          });
          if (value !== attribute.value) el.setAttribute(attribute.name, value);
        });
      });
      return page;
    }

    function pageStyles(frame, embeddedOnly) {
      let css = Array.from(frame.contentDocument.querySelectorAll('style')).map(function(style) { return style.textContent; }).join('\n');
      if (embeddedOnly) {
        css = css.replace(/@font-face\s*\{[^}]*\}/g, function(rule) { return rule.includes('data:font/') ? rule : ''; });
      }
      return css;
    }

    function preparePrint() {
      const output = document.getElementById('print-output');
      output.replaceChildren();
      try {
        selectedFrames().forEach(function(frame, index) {
          const sheet = document.createElement('div');
          sheet.className = 'print-page';
          const style = document.createElement('style');
          style.textContent = pageStyles(frame, false);
          sheet.append(style, cleanPage(frame, index));
          output.appendChild(sheet);
        });
        return true;
      } catch (err) {
        console.error('Unable to prepare the printable program:', err);
        editStatus.textContent = err.message;
        output.textContent = 'The program was not ready to print. Return to the page and try again.';
        return false;
      }
    }
    let printPrepared = false;
    window.addEventListener('beforeprint', function() { if (!printPrepared) preparePrint(); });
    window.addEventListener('afterprint', function() { printPrepared = false; });
    document.getElementById('print-pdf').addEventListener('click', async function() {
      if (!preparePrint()) return;
      printPrepared = true;
      try {
        await Promise.all(selectedFrames().map(function(frame) { return frame.contentDocument.fonts.ready; }));
        await document.fonts.ready;
        window.print();
      } catch (err) {
        printPrepared = false;
        console.error('Unable to print the program:', err);
        editStatus.textContent = 'Printing failed: ' + err.message;
      }
    });

    function createSvg(frame) {
      const svgNS = 'http://www.w3.org/2000/svg';
      const htmlNS = 'http://www.w3.org/1999/xhtml';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('xmlns', svgNS);
      svg.setAttribute('width', '148mm');
      svg.setAttribute('height', '210mm');
      svg.setAttribute('viewBox', '0 0 559 794');
      const foreign = document.createElementNS(svgNS, 'foreignObject');
      foreign.setAttribute('x', '0');
      foreign.setAttribute('y', '0');
      foreign.setAttribute('width', '559');
      foreign.setAttribute('height', '794');
      const wrapper = document.createElementNS(htmlNS, 'div');
      wrapper.setAttribute('xmlns', htmlNS);
      wrapper.setAttribute('style', 'width:559px;height:794px;overflow:hidden');
      const style = document.createElementNS(htmlNS, 'style');
      style.textContent = pageStyles(frame, true);
      wrapper.append(style, cleanPage(frame, 0));
      foreign.appendChild(wrapper);
      svg.appendChild(foreign);
      return new XMLSerializer().serializeToString(svg);
    }

    function download(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function() { URL.revokeObjectURL(url); }, 60000);
    }

    async function renderPageImage(frame) {
      await frame.contentDocument.fonts.ready;
      const svg = createSvg(frame);
      const image = new Image();
      await new Promise(function(resolve, reject) {
        image.onload = resolve;
        image.onerror = function() { reject(new Error('The card could not be rendered for PDF.')); };
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      });
      const canvas = document.createElement('canvas');
      canvas.width = 1118;
      canvas.height = 1588;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('This browser cannot create a PDF image.');
      context.fillStyle = '#fff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
